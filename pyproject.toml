[project]
name = "evo"
version = "0.1.0"
description = "AI autonomous universe observation and governance system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pip>=24.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "pydantic>=2.8.0",
    "psutil>=6.0.0",
    "numpy>=2.0.0",
    "networkx>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "config", "core", "isolation", "observer"]

[tool.hatch.build.targets.wheel.force-exclude]
"observer/web/node_modules" = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
